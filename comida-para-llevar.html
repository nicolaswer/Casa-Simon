<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Carta Para Llevar | Casa Simón</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        serif: ['"Playfair Display"', 'serif'],
                    },
                    colors: {
                        gold: { 500: '#D4AF37' },
                        dark: { 900: '#050505', 800: '#121212', 700: '#1c1c1c' }
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-dark-900 text-white font-sans antialiased">

    <header class="fixed top-0 left-0 w-full bg-dark-900/95 backdrop-blur-md border-b border-white/5 z-50">
        <nav class="max-w-7xl mx-auto flex items-center justify-between px-6 py-4">
            <a href="index.html" class="text-2xl font-serif font-bold text-white group">
                Casa <span class="text-gold-500 italic">Simón</span>
            </a>
            <a href="index.html" class="text-xs uppercase tracking-widest text-gold-500 hover:text-white transition-colors border border-gold-500 px-4 py-2 rounded-none">
                ← Volver al Inicio
            </a>
        </nav>
    </header>

    <section class="pt-32 pb-12 px-6 text-center bg-gradient-to-b from-black to-dark-900">
        <span class="text-gold-500 uppercase tracking-widest text-xs font-bold block mb-2">Para recoger en tienda</span>
        <h1 class="text-4xl md:text-5xl font-serif text-white mb-4">Nuestra Carta</h1>
        <p class="text-gray-400 text-sm max-w-lg mx-auto">
            Selecciona tus platos favoritos. Recuerda que trabajamos con producto fresco, 
            recomendamos encargar con antelación.
        </p>
    </section>

    <div id="filter-container" class="sticky top-[70px] z-40 bg-dark-900/95 backdrop-blur py-4 border-b border-white/5 overflow-x-auto">
        <div class="flex justify-start md:justify-center gap-4 px-6 min-w-max" id="category-buttons">
            </div>
    </div>

    <main class="max-w-4xl mx-auto px-6 py-12 min-h-screen relative">
        <div id="menu-container" class="space-y-16">
            <p class="text-center text-gray-500 animate-pulse">Cargando carta deliciosa...</p>
        </div>
    </main>

    <footer class="bg-black text-gray-600 py-8 text-center text-xs uppercase tracking-widest border-t border-white/5">
        <p>Precios con IVA incluido. Consulta alérgenos en el local.</p>
    </footer>

    <script>
        // Función principal
        async function cargarMenu() {
            try {
                const response = await fetch('menu.json'); // Carga el JSON
                const data = await response.json();
                
                renderizarBotones(data.categorias);
                renderizarCarta(data.categorias);
            } catch (error) {
                console.error('Error cargando el menú:', error);
                document.getElementById('menu-container').innerHTML = 
                    `<div class="text-center text-red-400">
                        <p>Hubo un error cargando la carta. Por favor, recarga la página.</p>
                     </div>`;
            }
        }

        // 1. Renderizar Botones de Categoría (Navegación rápida)
        function renderizarBotones(categorias) {
            const container = document.getElementById('category-buttons');
            let html = '';
            
            categorias.forEach(cat => {
                html += `
                    <a href="#${cat.id}" 
                       class="text-sm uppercase tracking-widest text-gray-400 hover:text-gold-500 border border-transparent hover:border-gold-500 px-4 py-2 transition-all whitespace-nowrap">
                       ${cat.nombre}
                    </a>
                `;
            });
            container.innerHTML = html;
        }

        // 2. Renderizar la Carta completa
        function renderizarCarta(categorias) {
            const container = document.getElementById('menu-container');
            let html = '';

            categorias.forEach(cat => {
                // Crear HTML de los platos
                let platosHTML = '';
                cat.platos.forEach(plato => {
                    platosHTML += `
                        <div class="group flex justify-between items-start border-b border-white/5 pb-4 mb-4 hover:border-gold-500/30 transition-colors">
                            <div class="pr-4">
                                <h4 class="text-lg font-serif text-white group-hover:text-gold-500 transition-colors">${plato.nombre}</h4>
                                <p class="text-sm text-gray-500 font-light mt-1">${plato.ingredientes}</p>
                            </div>
                            <div class="text-gold-500 font-bold font-serif text-lg whitespace-nowrap">
                                ${plato.precio}€
                            </div>
                        </div>
                    `;
                });

                // Crear HTML de la Categoría
                html += `
                    <section id="${cat.id}" class="scroll-mt-32 animate-fade-in">
                        <div class="flex items-end gap-4 mb-8 border-b border-white/10 pb-2">
                            <h2 class="text-3xl font-serif text-white">${cat.nombre}</h2>
                            <p class="text-gray-500 text-sm pb-1 hidden md:block">— ${cat.descripcion}</p>
                        </div>
                        <div class="grid md:grid-cols-1 gap-4">
                            ${platosHTML}
                        </div>
                    </section>
                `;
            });

            container.innerHTML = html;
        }

        // Ejecutar al cargar
        document.addEventListener('DOMContentLoaded', cargarMenu);
    </script>
</body>
</html>
